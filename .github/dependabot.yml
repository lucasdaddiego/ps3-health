version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows only: the composite action's own pins need their folder
    directories:
      - /
      - /.github/actions/ps3dev-sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # a version must be 7 days old before Dependabot offers it (security updates ignore this)
    cooldown:
      default-days: 7
