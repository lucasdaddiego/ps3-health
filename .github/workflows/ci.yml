name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host test and script smoke
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; the bundle and libelf1t64 are checked on 24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Host test (SMART decoders, vendor tables, trend lines and life left, issue link, QR, heat, ping, tones, NTP)
        run: |
          cc -std=c99 -Wall -Wextra -Werror -o test_smart test/test_smart.c source/smart.c source/vendor.c source/trend.c source/compat.c source/qrcodegen.c source/heat.c source/ping.c source/tone.c source/ntp.c -lm
          ./test_smart

      - name: Speed test preserves existing files and handles I/O failures
        run: python3 -I test/test_speed.py

      - name: Python scripts compile, verify_self.py --help
        run: |
          python3 -I -m py_compile verify_self.py tools/syscalls.py art/make_art.py
          python3 -I verify_self.py --help > /dev/null
          python3 -I tools/syscalls.py --selftest
          if PS3DEV_KEYS=/nonexistent python3 -I verify_self.py LICENSE 2> err.txt; then
            echo "verify_self.py accepted a non-SELF without a key file"; exit 1
          fi
          grep -q 'key file /nonexistent not found' err.txt

      - name: Shell syntax and sfo.xml
        run: |
          sudo apt-get install -y -qq zsh > /dev/null
          zsh -n build.sh
          zsh -n sdk_setup.sh
          python3 -I - <<'PY'
          import xml.etree.ElementTree as ET
          v = {e.get('name'): e.text.strip() for e in ET.parse('sfo.xml').getroot()}
          assert v['TITLE'] == 'PS3 Health' and v['TITLE_ID'] == 'HDSH00001', v
          PY

      - name: sfo.xml APP_VER and VERSION match source/version.h (2.1.0 is 02.10)
        shell: sh
        run: |
          v=$(sed -n 's/^#define APP_VERSION "\([0-9][0-9]*\.[0-9]\.[0-9]\)"$/\1/p' source/version.h)
          [ -n "$v" ] || { echo "source/version.h: no APP_VERSION \"X.Y.Z\" with a one-digit Y and Z"; exit 1; }
          want=$(printf '%02d.%d%d' $(echo "$v" | tr . ' '))
          for k in APP_VER VERSION; do
            got=$(sed -n "/<value name=\"$k\"/{n;s/[[:space:]]//g;p;}" sfo.xml)
            [ "$got" = "$want" ] || { echo "sfo.xml $k is '$got', source/version.h $v needs $want"; exit 1; }
          done
          echo "sfo.xml APP_VER and VERSION $want, source/version.h $v"

  pkg:
    name: PS3 pkg (Linux ps3dev bundle)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; the bundle and libelf1t64 are checked on 24.04
    env:
      # Optional: the key file for verify_self.py (see NOTICE item 6). Without
      # it the pkg is built and uploaded, and only the signature check is skipped.
      PS3DEV_KEYS_TOML: ${{ secrets.PS3DEV_KEYS_TOML }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ps3dev-sdk

      - name: make pkg
        run: |
          make pkg
          ls -la ps3_health.gnpdrm.pkg build/pkg/USRDIR/EBOOT.BIN

      - name: Syscall audit of the ELF (never 602, 604 or 870; only tools/syscalls.allow)
        run: python3 -I tools/syscalls.py build/ps3_health.elf

      - name: Verify the signed EBOOT against the ELF
        if: env.PS3DEV_KEYS_TOML != ''
        run: |
          python3 -m venv venv
          venv/bin/pip install -q pycryptodome
          umask 077
          printf '%s\n' "$PS3DEV_KEYS_TOML" > keys.toml
          PS3DEV_KEYS=$PWD/keys.toml venv/bin/python3 -I verify_self.py build/pkg/USRDIR/EBOOT.BIN build/ps3_health.elf
          rm -f keys.toml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ps3_health.gnpdrm.pkg
          path: ps3_health.gnpdrm.pkg
          if-no-files-found: error
